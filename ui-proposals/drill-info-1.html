<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Info 1 — Korttiryhmät</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: #1e293b; border-bottom: 1px solid #334155; flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; }
  .back-btn { background: none; border: none; color: #94a3b8; font-size: 13px; cursor: pointer; padding: 5px 8px; border-radius: 8px; }
  .name-input { background: #0f172a; border: 1px solid #334155; color: #f1f5f9; font-size: 14px; font-weight: 600; padding: 5px 10px; border-radius: 8px; width: 200px; }
  .step-indicator { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center; }
  .step { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .step-num { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .step.done { color: #4ade80; } .step.done .step-num { background: #14532d; color: #4ade80; }
  .step.active { color: #e2e8f0; background: #1e3a5f; } .step.active .step-num { background: #3b82f6; color: #fff; }
  .step-arrow { color: #334155; font-size: 14px; }
  .save-btn { background: #16a34a; color: #fff; border: none; padding: 6px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }

  /* Body */
  .body { flex: 1; display: flex; overflow: hidden; }

  /* Left preview */
  .preview-panel {
    width: 340px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 16px 48px; background: #0d1b2a; border-right: 1px solid #334155;
    position: relative; overflow: hidden;
  }
  .preview-label {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(30,41,59,0.85); border: 1px solid #334155; border-radius: 20px;
    padding: 3px 10px; font-size: 11px; color: #64748b; white-space: nowrap;
  }
  .canvas-preview {
    width: 100%; max-height: 220px; aspect-ratio: 800/560;
    background: #2d7a3a; border-radius: 10px; border: 2px solid #2d3f50;
    position: relative; overflow: hidden; opacity: 0.88;
  }
  .canvas-preview::before { content: ''; position: absolute; inset: 12px; border: 2px solid rgba(255,255,255,0.5); border-radius: 2px; }
  .obj { position: absolute; width: 18px; height: 18px; border-radius: 50%; transform: translate(-50%,-50%); }
  .obj-red { background: #ef4444; } .obj-blue { background: #3b82f6; }
  .preview-edit-btn {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(30,41,59,0.9); border: 1px solid #334155; border-radius: 20px;
    padding: 5px 14px; font-size: 12px; color: #94a3b8; cursor: pointer; font-weight: 600; white-space: nowrap;
  }

  /* Right: info form — card sections */
  .info-panel {
    flex: 1; background: #0f172a; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .section-card {
    background: #1e293b; border: 1px solid #2d3f50; border-radius: 12px; overflow: hidden;
  }
  .section-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid #2d3f50;
    background: #1a2a40;
  }
  .section-icon { font-size: 14px; }
  .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; }
  .section-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }

  .field-row { display: flex; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .field-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b; }
  .field-input {
    width: 100%; background: #0f172a; border: 1px solid #334155; color: #f1f5f9;
    font-size: 13px; padding: 7px 10px; border-radius: 8px;
  }
  .field-input:focus { outline: none; border-color: #22c55e; }
  textarea.field-input { resize: none; height: 90px; font-family: inherit; }
  .field-input.tall { height: 120px; }

  .tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    padding: 4px 10px; border-radius: 20px; font-size: 12px;
    background: #0f172a; color: #64748b; cursor: pointer; border: 1px solid #334155;
    transition: all 0.15s;
  }
  .tag:hover { border-color: #475569; color: #94a3b8; }
  .tag.active { background: #14532d; color: #4ade80; border-color: #16a34a; }

  .count-hint { font-size: 11px; color: #475569; text-align: right; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="back-btn">← Takaisin</button>
    <input class="name-input" value="1v1 Puolustusharjoitus">
  </div>
  <div class="step-indicator">
    <div class="step done"><div class="step-num">✓</div>Piirtäminen</div>
    <span class="step-arrow">›</span>
    <div class="step active"><div class="step-num">2</div>Tiedot</div>
  </div>
  <button class="save-btn">💾 Tallenna harjoite</button>
</div>

<div class="body">

  <!-- Preview -->
  <div class="preview-panel">
    <div class="preview-label">Piirretty harjoite</div>
    <div class="canvas-preview">
      <div style="position:absolute;top:12px;bottom:12px;left:50%;width:2px;background:rgba(255,255,255,0.5)"></div>
      <div style="position:absolute;top:50%;left:50%;width:70px;height:70px;border:2px solid rgba(255,255,255,0.5);border-radius:50%;transform:translate(-50%,-50%)"></div>
      <div class="obj obj-red" style="left:30%;top:45%"></div>
      <div class="obj obj-red" style="left:35%;top:55%"></div>
      <div class="obj obj-blue" style="left:62%;top:50%"></div>
      <div style="position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid #eab308"></div>
      <div style="position:absolute;left:50%;top:70%;transform:translate(-50%,-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid #eab308"></div>
    </div>
    <button class="preview-edit-btn">✎ Muokkaa piirtoa</button>
  </div>

  <!-- Info form: card sections -->
  <div class="info-panel">

    <!-- Perustiedot -->
    <div class="section-card">
      <div class="section-header">
        <span class="section-icon">📋</span>
        <span class="section-title">Perustiedot</span>
      </div>
      <div class="section-body">
        <div class="field-row">
          <div class="field">
            <div class="field-label">Kategoria</div>
            <select class="field-input">
              <option>Taktinen</option><option>Tekninen</option>
              <option>Fyysinen</option><option>Lämmittely</option><option>Peli</option>
            </select>
          </div>
          <div class="field" style="max-width:80px">
            <div class="field-label">Kesto (min)</div>
            <input class="field-input" type="number" value="15">
          </div>
          <div class="field" style="max-width:80px">
            <div class="field-label">Toistot</div>
            <input class="field-input" type="number" value="3">
          </div>
        </div>
      </div>
    </div>

    <!-- Kuvaus -->
    <div class="section-card">
      <div class="section-header">
        <span class="section-icon">📝</span>
        <span class="section-title">Kuvaus ja tavoitteet</span>
      </div>
      <div class="section-body">
        <div class="field">
          <div class="field-label">Harjoitteen kuvaus</div>
          <textarea class="field-input tall" placeholder="Kuvaa harjoite...">Yksilöpuolustusharjoitus, painopiste asemoinnissa. Hyökkääjä yrittää ohittaa puolustajan ja puolustaja pyrkii säilyttämään asemansa.</textarea>
        </div>
        <div class="field">
          <div class="field-label">Tavoitteet</div>
          <textarea class="field-input" placeholder="Mitä harjoite kehittää?">Parantaa puolustusasentoa, jalkatyötä ja reaktioaikaa 1v1-tilanteissa.</textarea>
        </div>
      </div>
    </div>

    <!-- Tagit -->
    <div class="section-card">
      <div class="section-header">
        <span class="section-icon">🏷</span>
        <span class="section-title">Tagit</span>
      </div>
      <div class="section-body">
        <div class="tag-cloud">
          <span class="tag active">1v1</span>
          <span class="tag active">Puolustaminen</span>
          <span class="tag">2v1</span>
          <span class="tag">Syöttäminen</span>
          <span class="tag">Nopeus</span>
          <span class="tag">Laukaus</span>
          <span class="tag">Yhteistyö</span>
          <span class="tag">Maalivahti</span>
          <span class="tag">Painostus</span>
        </div>
        <div class="count-hint">2 valittu</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
