<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B — Kompakti kelluvat työkalut + taittuva info</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: none; color: #94a3b8; font-size: 13px; cursor: pointer;
    padding: 5px 8px; border-radius: 8px;
  }
  .back-btn:hover { background: #334155; color: #e2e8f0; }
  .name-input {
    background: #0f172a; border: 1px solid #334155; color: #f1f5f9;
    font-size: 14px; font-weight: 600; padding: 5px 10px; border-radius: 8px; width: 200px;
  }
  .name-input:focus { outline: none; border-color: #22c55e; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .info-toggle-btn {
    display: flex; align-items: center; gap: 5px;
    background: #334155; border: none; color: #94a3b8; font-size: 12px;
    font-weight: 600; padding: 5px 10px; border-radius: 8px; cursor: pointer;
  }
  .info-toggle-btn.active { background: #1d4ed8; color: #bfdbfe; }
  .info-toggle-btn:hover { color: #e2e8f0; }
  .save-btn {
    background: #16a34a; color: #fff; border: none; padding: 6px 14px;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .save-btn:hover { background: #15803d; }

  /* Main layout */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  /* Canvas fills everything */
  .canvas-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    position: relative;
    overflow: hidden;
  }

  /* Field type pills - thin bar above canvas */
  .field-pills {
    display: flex; gap: 5px; margin-bottom: 8px;
  }
  .field-pill {
    padding: 2px 9px; border-radius: 20px; border: 1px solid #334155;
    background: none; color: #64748b; font-size: 11px; cursor: pointer;
  }
  .field-pill.active { background: #334155; color: #e2e8f0; border-color: #475569; }

  .canvas-wrap {
    position: relative;
    width: 100%;
    max-height: calc(100vh - 110px);
    aspect-ratio: 800/560;
  }

  .canvas-mock {
    width: 100%;
    height: 100%;
    background: #2d7a3a;
    border-radius: 12px;
    border: 2px solid #334155;
    position: relative;
    overflow: hidden;
  }
  .canvas-mock::before {
    content: '';
    position: absolute; inset: 16px;
    border: 2px solid rgba(255,255,255,0.6);
    border-radius: 2px;
  }
  .center-line {
    position: absolute; top: 16px; bottom: 16px; left: 50%; width: 2px;
    background: rgba(255,255,255,0.6);
  }
  .center-circle {
    position: absolute; top: 50%; left: 50%;
    width: 90px; height: 90px;
    border: 2px solid rgba(255,255,255,0.6);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  /* Floating vertical tool palette — left side, auto-height */
  .tool-palette {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(10px);
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 8px 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    z-index: 10;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .tool-btn {
    width: 36px; height: 36px; border-radius: 9px; border: none;
    background: none; color: #94a3b8; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; transition: all 0.15s;
  }
  .tool-btn:hover { background: #334155; color: #e2e8f0; }
  .tool-btn.active { background: #16a34a; color: #fff; }
  .tool-sep { height: 1px; background: #334155; margin: 4px 0; }

  /* Floating color/size row — bottom of canvas */
  .bottom-controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(10px);
    border: 1px solid #334155;
    border-radius: 40px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 10;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .color-dot {
    width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; transition: transform 0.15s; flex-shrink: 0;
  }
  .color-dot:hover { transform: scale(1.2); }
  .color-dot.active { border-color: #fff; transform: scale(1.15); }
  .ctrl-sep { width: 1px; height: 20px; background: #334155; }
  .size-btn {
    padding: 0 7px; height: 26px; border-radius: 6px; border: none;
    background: none; color: #94a3b8; font-size: 11px; font-weight: 700; cursor: pointer;
  }
  .size-btn.active { background: #16a34a; color: #fff; }
  .undo-btn {
    width: 28px; height: 28px; border-radius: 7px; border: none;
    background: none; color: #94a3b8; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .undo-btn:hover { background: #334155; color: #e2e8f0; }

  /* Demo objects */
  .obj {
    position: absolute;
    width: 20px; height: 20px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .obj-red { background: #ef4444; }
  .obj-blue { background: #3b82f6; }
  .obj-cone {
    width: 0; height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-bottom: 16px solid #eab308;
    background: none; border-radius: 0;
  }

  /* Sliding info drawer from right */
  .info-drawer {
    width: 0;
    overflow: hidden;
    background: #1e293b;
    border-left: 1px solid #334155;
    display: flex;
    flex-direction: column;
    transition: width 0.25s ease;
    flex-shrink: 0;
  }
  .info-drawer.open {
    width: 260px;
  }
  .info-inner {
    width: 260px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    flex: 1;
  }
  .panel-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: #64748b; margin-bottom: 4px;
  }
  .panel-input {
    width: 100%; background: #0f172a; border: 1px solid #334155;
    color: #f1f5f9; font-size: 13px; padding: 6px 10px; border-radius: 8px;
  }
  .panel-input:focus { outline: none; border-color: #22c55e; }
  textarea.panel-input { resize: none; height: 60px; }
  .panel-row { display: flex; gap: 6px; }
  .panel-row .panel-input { flex: 1; }
  .tag-cloud { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { padding: 3px 8px; border-radius: 20px; font-size: 11px;
    background: #334155; color: #94a3b8; cursor: pointer; border: 1px solid transparent; }
  .tag.active { background: #14532d; color: #4ade80; border-color: #16a34a; }

  /* Drawer is open by default */
  .info-toggle-hint {
    font-size: 11px; color: #64748b; text-align: center; padding: 10px;
  }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-left">
    <button class="back-btn">← Takaisin</button>
    <input class="name-input" value="1v1 Puolustusharjoitus">
  </div>
  <div class="topbar-right">
    <button class="info-toggle-btn active" onclick="toggleDrawer(this)">📋 Tiedot</button>
    <button class="save-btn">💾 Tallenna</button>
  </div>
</div>

<!-- Main -->
<div class="main">

  <!-- Canvas fills all remaining space -->
  <div class="canvas-area">
    <div class="field-pills">
      <button class="field-pill active">Koko kenttä</button>
      <button class="field-pill">Puolikenttä</button>
      <button class="field-pill">Pienkenttä</button>
      <button class="field-pill">Rangaistus</button>
      <button class="field-pill">Tyhjä</button>
    </div>

    <div class="canvas-wrap">
      <div class="canvas-mock">
        <div class="center-line"></div>
        <div class="center-circle"></div>
        <div class="obj obj-red" style="left:30%;top:45%"></div>
        <div class="obj obj-red" style="left:35%;top:55%"></div>
        <div class="obj obj-blue" style="left:60%;top:50%"></div>
        <div class="obj obj-cone" style="left:50%;top:30%;transform:translate(-50%,-50%)"></div>
        <div class="obj obj-cone" style="left:50%;top:70%;transform:translate(-50%,-50%)"></div>
      </div>

      <!-- Floating vertical tool palette -->
      <div class="tool-palette">
        <button class="tool-btn" title="Valitse">⊹</button>
        <button class="tool-btn active" title="Pelaaja">👤</button>
        <button class="tool-btn" title="Vastustaja">✕</button>
        <button class="tool-btn" title="Kartio">▲</button>
        <button class="tool-btn" title="Pallo">⚽</button>
        <button class="tool-btn" title="Maali">⬛</button>
        <div class="tool-sep"></div>
        <button class="tool-btn" title="Nuoli">→</button>
        <button class="tool-btn" title="Katkoviiva">⇢</button>
        <button class="tool-btn" title="Käyrä">~</button>
        <button class="tool-btn" title="Alue">▭</button>
        <button class="tool-btn" title="Teksti">T</button>
      </div>

      <!-- Floating bottom color + size + undo -->
      <div class="bottom-controls">
        <div class="color-dot active" style="background:#22c55e"></div>
        <div class="color-dot" style="background:#ef4444"></div>
        <div class="color-dot" style="background:#3b82f6"></div>
        <div class="color-dot" style="background:#eab308"></div>
        <div class="color-dot" style="background:#f97316"></div>
        <div class="color-dot" style="background:#ffffff"></div>
        <div class="ctrl-sep"></div>
        <button class="size-btn">S</button>
        <button class="size-btn active">M</button>
        <button class="size-btn">L</button>
        <div class="ctrl-sep"></div>
        <button class="undo-btn" title="Kumoa">↩</button>
        <button class="undo-btn" title="Tyhjennä" style="color:#ef4444">🗑</button>
      </div>
    </div>
  </div>

  <!-- Sliding info drawer -->
  <div class="info-drawer open" id="infoDrawer">
    <div class="info-inner">
      <div>
        <div class="panel-label">Kategoria</div>
        <select class="panel-input">
          <option>Taktinen</option>
          <option>Tekninen</option>
          <option>Fyysinen</option>
          <option>Lämmittely</option>
          <option>Peli</option>
        </select>
      </div>
      <div class="panel-row">
        <div>
          <div class="panel-label">Kesto (min)</div>
          <input class="panel-input" type="number" value="15">
        </div>
        <div>
          <div class="panel-label">Toistot</div>
          <input class="panel-input" type="number" value="3">
        </div>
      </div>
      <div>
        <div class="panel-label">Kuvaus</div>
        <textarea class="panel-input">Yksilöpuolustusharjoitus, painopiste asemoinnissa.</textarea>
      </div>
      <div>
        <div class="panel-label">Tavoitteet</div>
        <textarea class="panel-input" placeholder="Mitä harjoite kehittää?"></textarea>
      </div>
      <div>
        <div class="panel-label">Tagit</div>
        <div class="tag-cloud">
          <span class="tag active">1v1</span>
          <span class="tag active">Puolustaminen</span>
          <span class="tag">2v1</span>
          <span class="tag">Syöttäminen</span>
          <span class="tag">Nopeus</span>
          <span class="tag">Laukaus</span>
          <span class="tag">Yhteistyö</span>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
function toggleDrawer(btn) {
  const drawer = document.getElementById('infoDrawer');
  const isOpen = drawer.classList.toggle('open');
  btn.classList.toggle('active', isOpen);
}
</script>
</body>
</html>
