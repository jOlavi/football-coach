<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Info 3 — Välilehdet</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: #1e293b; border-bottom: 1px solid #334155; flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; }
  .back-btn { background: none; border: none; color: #94a3b8; font-size: 13px; cursor: pointer; padding: 5px 8px; border-radius: 8px; }
  .name-input { background: #0f172a; border: 1px solid #334155; color: #f1f5f9; font-size: 14px; font-weight: 600; padding: 5px 10px; border-radius: 8px; width: 200px; }
  .step-indicator { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center; }
  .step { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .step-num { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .step.done { color: #4ade80; } .step.done .step-num { background: #14532d; color: #4ade80; }
  .step.active { color: #e2e8f0; background: #1e3a5f; } .step.active .step-num { background: #3b82f6; color: #fff; }
  .step-arrow { color: #334155; font-size: 14px; }
  .save-btn { background: #16a34a; color: #fff; border: none; padding: 6px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }

  .body { flex: 1; display: flex; overflow: hidden; }

  /* Left preview */
  .preview-panel {
    width: 340px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 16px 48px; background: #0d1b2a; border-right: 1px solid #263547;
    position: relative; overflow: hidden;
  }
  .preview-label {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(30,41,59,0.85); border: 1px solid #334155; border-radius: 20px;
    padding: 3px 10px; font-size: 11px; color: #64748b; white-space: nowrap;
  }
  .canvas-preview {
    width: 100%; max-height: 220px; aspect-ratio: 800/560;
    background: #2d7a3a; border-radius: 10px; border: 2px solid #2d3f50;
    position: relative; overflow: hidden; opacity: 0.88;
  }
  .canvas-preview::before { content: ''; position: absolute; inset: 12px; border: 2px solid rgba(255,255,255,0.5); border-radius: 2px; }
  .obj { position: absolute; width: 18px; height: 18px; border-radius: 50%; transform: translate(-50%,-50%); }
  .obj-red { background: #ef4444; } .obj-blue { background: #3b82f6; }
  .preview-edit-btn {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(30,41,59,0.9); border: 1px solid #334155; border-radius: 20px;
    padding: 5px 14px; font-size: 12px; color: #94a3b8; cursor: pointer; font-weight: 600; white-space: nowrap;
  }

  /* Right: tab-based info panel */
  .info-panel {
    flex: 1; background: #0f172a; display: flex; flex-direction: column; overflow: hidden;
  }

  /* Tab bar */
  .tab-bar {
    display: flex; background: #1e293b; border-bottom: 1px solid #334155; flex-shrink: 0;
    padding: 0 16px; gap: 0;
  }
  .tab-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 12px 16px; border: none; background: none;
    color: #64748b; font-size: 13px; font-weight: 600; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: all 0.15s;
  }
  .tab-btn:hover { color: #94a3b8; }
  .tab-btn.active { color: #e2e8f0; border-bottom-color: #22c55e; }
  .tab-icon { font-size: 14px; }
  .tab-badge {
    background: #14532d; color: #4ade80; border-radius: 10px;
    font-size: 10px; font-weight: 700; padding: 1px 6px;
  }

  /* Tab content */
  .tab-content { flex: 1; overflow-y: auto; padding: 24px; }
  .tab-pane { display: none; flex-direction: column; gap: 16px; }
  .tab-pane.active { display: flex; }

  /* Fields */
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #64748b; }
  .field-input {
    background: #1e293b; border: 1px solid #334155; color: #f1f5f9;
    font-size: 14px; padding: 10px 12px; border-radius: 10px; font-family: inherit;
    width: 100%; outline: none; transition: border-color 0.15s;
  }
  .field-input:focus { border-color: #22c55e; }
  textarea.field-input { resize: none; height: 130px; line-height: 1.6; }
  textarea.field-input.tall { height: 180px; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }

  /* Stat pills for perustiedot tab */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
  }
  .stat-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #64748b; }
  .stat-input {
    background: none; border: none; color: #f1f5f9;
    font-size: 22px; font-weight: 700; width: 100%; outline: none; padding: 0;
    font-family: inherit;
  }
  .stat-unit { font-size: 11px; color: #64748b; }
  .stat-card.wide { grid-column: span 2; }

  /* Tags tab */
  .tag-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #64748b; margin-bottom: 8px; }
  .tag-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
    background: #1e293b; color: #64748b; cursor: pointer; border: 1px solid #334155;
    transition: all 0.15s;
  }
  .tag:hover { border-color: #475569; color: #94a3b8; }
  .tag.active { background: #052e16; color: #4ade80; border-color: #16a34a; font-weight: 600; }

  .completion-bar {
    background: #1e293b; border-radius: 8px; height: 4px; margin-top: 8px; overflow: hidden;
  }
  .completion-fill { height: 100%; background: #22c55e; border-radius: 8px; transition: width 0.3s; }
  .completion-text { font-size: 11px; color: #475569; margin-top: 4px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="back-btn">← Takaisin</button>
    <input class="name-input" value="1v1 Puolustusharjoitus">
  </div>
  <div class="step-indicator">
    <div class="step done"><div class="step-num">✓</div>Piirtäminen</div>
    <span class="step-arrow">›</span>
    <div class="step active"><div class="step-num">2</div>Tiedot</div>
  </div>
  <button class="save-btn">💾 Tallenna harjoite</button>
</div>

<div class="body">

  <div class="preview-panel">
    <div class="preview-label">Piirretty harjoite</div>
    <div class="canvas-preview">
      <div style="position:absolute;top:12px;bottom:12px;left:50%;width:2px;background:rgba(255,255,255,0.5)"></div>
      <div style="position:absolute;top:50%;left:50%;width:70px;height:70px;border:2px solid rgba(255,255,255,0.5);border-radius:50%;transform:translate(-50%,-50%)"></div>
      <div class="obj obj-red" style="left:30%;top:45%"></div>
      <div class="obj obj-red" style="left:35%;top:55%"></div>
      <div class="obj obj-blue" style="left:62%;top:50%"></div>
      <div style="position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid #eab308"></div>
      <div style="position:absolute;left:50%;top:70%;transform:translate(-50%,-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid #eab308"></div>
    </div>
    <button class="preview-edit-btn">✎ Muokkaa piirtoa</button>
  </div>

  <!-- Tab-based info panel -->
  <div class="info-panel">
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('perustiedot', this)">
        <span class="tab-icon">📋</span> Perustiedot
      </button>
      <button class="tab-btn" onclick="switchTab('kuvaus', this)">
        <span class="tab-icon">📝</span> Kuvaus
      </button>
      <button class="tab-btn" onclick="switchTab('tagit', this)">
        <span class="tab-icon">🏷</span> Tagit
        <span class="tab-badge">2</span>
      </button>
    </div>

    <div class="tab-content">

      <!-- Tab 1: Perustiedot -->
      <div class="tab-pane active" id="tab-perustiedot">
        <div class="field">
          <div class="field-label">Kategoria</div>
          <select class="field-input">
            <option>Taktinen</option><option>Tekninen</option>
            <option>Fyysinen</option><option>Lämmittely</option><option>Peli</option>
          </select>
        </div>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Kesto</div>
            <input class="stat-input" type="number" value="15">
            <div class="stat-unit">minuuttia</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Toistot</div>
            <input class="stat-input" type="number" value="3">
            <div class="stat-unit">kertaa</div>
          </div>
        </div>
        <div class="completion-bar"><div class="completion-fill" style="width:100%"></div></div>
        <div class="completion-text">Perustiedot täytetty ✓</div>
      </div>

      <!-- Tab 2: Kuvaus -->
      <div class="tab-pane" id="tab-kuvaus">
        <div class="field">
          <div class="field-label">Harjoitteen kuvaus</div>
          <textarea class="field-input tall">Yksilöpuolustusharjoitus, painopiste asemoinnissa. Hyökkääjä yrittää ohittaa puolustajan ja puolustaja pyrkii säilyttämään asemansa.</textarea>
        </div>
        <div class="field">
          <div class="field-label">Tavoitteet</div>
          <textarea class="field-input">Parantaa puolustusasentoa, jalkatyötä ja reaktioaikaa 1v1-tilanteissa.</textarea>
        </div>
        <div class="completion-bar"><div class="completion-fill" style="width:80%"></div></div>
        <div class="completion-text">Tavoitteet vielä kesken</div>
      </div>

      <!-- Tab 3: Tagit -->
      <div class="tab-pane" id="tab-tagit">
        <div>
          <div class="tag-section-title">Tilanne</div>
          <div class="tag-grid">
            <span class="tag active">1v1</span>
            <span class="tag">2v1</span>
            <span class="tag">2v2</span>
            <span class="tag">3v3</span>
            <span class="tag">Pienkenttä</span>
          </div>
        </div>
        <div>
          <div class="tag-section-title">Ominaisuus</div>
          <div class="tag-grid">
            <span class="tag active">Puolustaminen</span>
            <span class="tag">Syöttäminen</span>
            <span class="tag">Nopeus</span>
            <span class="tag">Laukaus</span>
            <span class="tag">Yhteistyö</span>
            <span class="tag">Maalivahti</span>
            <span class="tag">Painostus</span>
          </div>
        </div>
        <div class="completion-bar"><div class="completion-fill" style="width:60%"></div></div>
        <div class="completion-text">2 tagia valittu</div>
      </div>

    </div>
  </div>

</div>

<script>
function switchTab(id, btn) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}
</script>
</body>
</html>
