<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C — Kaksivaiheinen: Ensin piirtäminen, sitten tiedot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
    gap: 10px;
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .back-btn {
    background: none; border: none; color: #94a3b8; font-size: 13px; cursor: pointer;
    padding: 5px 8px; border-radius: 8px; white-space: nowrap;
  }
  .back-btn:hover { background: #334155; color: #e2e8f0; }
  .name-input {
    background: #0f172a; border: 1px solid #334155; color: #f1f5f9;
    font-size: 14px; font-weight: 600; padding: 5px 10px; border-radius: 8px; width: 180px;
  }
  .name-input:focus { outline: none; border-color: #22c55e; }

  /* Step indicator in topbar */
  .step-indicator {
    display: flex; align-items: center; gap: 6px;
    flex: 1; justify-content: center;
  }
  .step {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
  }
  .step-num {
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
  }
  .step.inactive { color: #475569; }
  .step.inactive .step-num { background: #334155; color: #475569; }
  .step.active { color: #e2e8f0; background: #1e3a5f; }
  .step.active .step-num { background: #3b82f6; color: #fff; }
  .step.done { color: #4ade80; }
  .step.done .step-num { background: #14532d; color: #4ade80; }
  .step-arrow { color: #334155; font-size: 14px; }

  .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .next-btn {
    background: #1d4ed8; color: #fff; border: none; padding: 6px 14px;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }
  .next-btn:hover { background: #1e40af; }
  .save-btn {
    background: #16a34a; color: #fff; border: none; padding: 6px 14px;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: none;
  }
  .save-btn:hover { background: #15803d; }
  .save-btn.visible { display: block; }

  /* ======== STEP 1: Draw ======== */
  #step1 {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Toolbar at top of canvas area */
  .draw-toolbar {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 12px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .tool-btn {
    width: 34px; height: 34px; border-radius: 8px; border: none;
    background: none; color: #94a3b8; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; transition: all 0.15s;
  }
  .tool-btn:hover { background: #334155; color: #e2e8f0; }
  .tool-btn.active { background: #16a34a; color: #fff; }
  .tool-sep { width: 1px; height: 22px; background: #334155; margin: 0 4px; }
  .color-dot {
    width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; flex-shrink: 0; transition: transform 0.12s;
  }
  .color-dot:hover { transform: scale(1.2); }
  .color-dot.active { border-color: #fff; transform: scale(1.15); }
  .size-btn {
    padding: 0 8px; height: 26px; border-radius: 6px; border: none;
    background: none; color: #94a3b8; font-size: 11px; font-weight: 700; cursor: pointer;
  }
  .size-btn.active { background: #16a34a; color: #fff; }

  /* Canvas fullscreen for step 1 */
  .canvas-area-full {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
  }
  .field-pills {
    display: flex; gap: 5px; margin-bottom: 8px;
  }
  .field-pill {
    padding: 2px 9px; border-radius: 20px; border: 1px solid #334155;
    background: none; color: #64748b; font-size: 11px; cursor: pointer;
  }
  .field-pill.active { background: #334155; color: #e2e8f0; border-color: #475569; }

  .canvas-mock {
    width: 100%;
    max-height: calc(100vh - 155px);
    aspect-ratio: 800/560;
    background: #2d7a3a;
    border-radius: 12px;
    border: 2px solid #334155;
    position: relative;
    overflow: hidden;
  }
  .canvas-mock::before {
    content: ''; position: absolute; inset: 16px;
    border: 2px solid rgba(255,255,255,0.6); border-radius: 2px;
  }
  .center-line {
    position: absolute; top: 16px; bottom: 16px; left: 50%; width: 2px;
    background: rgba(255,255,255,0.6);
  }
  .center-circle {
    position: absolute; top: 50%; left: 50%;
    width: 90px; height: 90px;
    border: 2px solid rgba(255,255,255,0.6); border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .obj {
    position: absolute; width: 20px; height: 20px;
    border-radius: 50%; transform: translate(-50%, -50%);
  }
  .obj-red { background: #ef4444; }
  .obj-blue { background: #3b82f6; }
  .obj-cone {
    width: 0; height: 0;
    border-left: 9px solid transparent; border-right: 9px solid transparent;
    border-bottom: 16px solid #eab308;
    background: none; border-radius: 0;
  }

  /* ======== STEP 2: Info + preview ======== */
  #step2 {
    flex: 1;
    display: none;
    overflow: hidden;
  }
  #step2.visible { display: flex; }

  /* Left: canvas preview (locked) */
  .preview-panel {
    width: 340px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px 48px;
    background: #0d1b2a;
    border-right: 1px solid #334155;
    position: relative;
    overflow: hidden;
  }
  .preview-label {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(30,41,59,0.85); backdrop-filter: blur(6px);
    border: 1px solid #334155; border-radius: 20px;
    padding: 3px 10px; font-size: 11px; color: #64748b; white-space: nowrap;
  }
  .preview-edit-btn {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(30,41,59,0.9); backdrop-filter: blur(6px);
    border: 1px solid #334155; border-radius: 20px;
    padding: 5px 14px; font-size: 12px; color: #94a3b8;
    cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  .preview-edit-btn:hover { border-color: #475569; color: #e2e8f0; }
  .canvas-preview {
    width: 100%;
    max-height: 260px;
    aspect-ratio: 800/560;
    background: #2d7a3a;
    border-radius: 10px;
    border: 2px solid #2d3f50;
    position: relative;
    overflow: hidden;
    opacity: 0.88;
  }
  .canvas-preview::before {
    content: ''; position: absolute; inset: 14px;
    border: 2px solid rgba(255,255,255,0.5); border-radius: 2px;
  }

  /* Right: info form */
  .info-panel {
    flex: 1;
    background: #1e293b;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 18px;
    gap: 14px;
    min-width: 0;
  }
  .info-title {
    font-size: 13px; font-weight: 700; color: #e2e8f0;
    padding-bottom: 10px; border-bottom: 1px solid #334155;
  }
  .panel-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: #64748b; margin-bottom: 4px;
  }
  .panel-input {
    width: 100%; background: #0f172a; border: 1px solid #334155;
    color: #f1f5f9; font-size: 13px; padding: 7px 10px; border-radius: 8px;
  }
  .panel-input:focus { outline: none; border-color: #22c55e; }
  textarea.panel-input { resize: none; height: 100px; }
  .panel-row { display: flex; gap: 8px; }
  .panel-row > div { flex: 1; }
  .tag-cloud { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    padding: 3px 8px; border-radius: 20px; font-size: 11px;
    background: #334155; color: #94a3b8; cursor: pointer; border: 1px solid transparent;
  }
  .tag.active { background: #14532d; color: #4ade80; border-color: #16a34a; }

  /* Progress hint */
  .progress-hint {
    font-size: 11px; color: #475569; text-align: center; padding-top: 4px;
  }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-left">
    <button class="back-btn">← Takaisin</button>
    <input class="name-input" value="1v1 Puolustusharjoitus">
  </div>

  <!-- Step indicator -->
  <div class="step-indicator">
    <div class="step done" id="stepBtn1" onclick="goToStep(1)">
      <div class="step-num">✓</div>
      Piirtäminen
    </div>
    <span class="step-arrow">›</span>
    <div class="step active" id="stepBtn2">
      <div class="step-num">2</div>
      Tiedot
    </div>
  </div>

  <div class="topbar-right">
    <button class="next-btn" id="nextBtn" onclick="goToStep2()">Seuraava →</button>
    <button class="save-btn" id="saveBtn">💾 Tallenna harjoite</button>
  </div>
</div>

<!-- STEP 1: Draw -->
<div id="step1">
  <!-- Tool strip -->
  <div class="draw-toolbar">
    <button class="tool-btn" title="Valitse">⊹</button>
    <button class="tool-btn active" title="Pelaaja">👤</button>
    <button class="tool-btn" title="Vastustaja">✕</button>
    <button class="tool-btn" title="Kartio">▲</button>
    <button class="tool-btn" title="Pallo">⚽</button>
    <button class="tool-btn" title="Maali">⬛</button>
    <div class="tool-sep"></div>
    <button class="tool-btn" title="Nuoli">→</button>
    <button class="tool-btn" title="Katkoviiva">⇢</button>
    <button class="tool-btn" title="Käyrä">~</button>
    <button class="tool-btn" title="Alue">▭</button>
    <button class="tool-btn" title="Teksti">T</button>
    <div class="tool-sep"></div>
    <div class="color-dot active" style="background:#22c55e"></div>
    <div class="color-dot" style="background:#ef4444"></div>
    <div class="color-dot" style="background:#3b82f6"></div>
    <div class="color-dot" style="background:#eab308"></div>
    <div class="color-dot" style="background:#f97316"></div>
    <div class="color-dot" style="background:#ffffff"></div>
    <div class="tool-sep"></div>
    <button class="size-btn">S</button>
    <button class="size-btn active">M</button>
    <button class="size-btn">L</button>
    <div class="tool-sep"></div>
    <button class="tool-btn" title="Kumoa">↩</button>
    <button class="tool-btn" title="Tyhjennä" style="color:#ef4444">🗑</button>
  </div>

  <div class="canvas-area-full">
    <div class="field-pills">
      <button class="field-pill active">Koko kenttä</button>
      <button class="field-pill">Puolikenttä</button>
      <button class="field-pill">Pienkenttä</button>
      <button class="field-pill">Rangaistus</button>
      <button class="field-pill">Tyhjä</button>
    </div>
    <div class="canvas-mock">
      <div class="center-line"></div>
      <div class="center-circle"></div>
      <div class="obj obj-red" style="left:30%;top:45%"></div>
      <div class="obj obj-red" style="left:35%;top:55%"></div>
      <div class="obj obj-blue" style="left:60%;top:50%"></div>
      <div class="obj obj-cone" style="left:50%;top:30%;transform:translate(-50%,-50%)"></div>
      <div class="obj obj-cone" style="left:50%;top:70%;transform:translate(-50%,-50%)"></div>
    </div>
  </div>
</div>

<!-- STEP 2: Info + preview -->
<div id="step2">

  <!-- Left: canvas preview -->
  <div class="preview-panel">
    <div class="preview-label">Piirretty harjoite</div>
    <div class="canvas-preview">
      <div class="center-line" style="position:absolute;top:14px;bottom:14px;left:50%;width:2px;background:rgba(255,255,255,0.5)"></div>
      <div style="position:absolute;top:50%;left:50%;width:80px;height:80px;border:2px solid rgba(255,255,255,0.5);border-radius:50%;transform:translate(-50%,-50%)"></div>
      <div class="obj obj-red" style="left:30%;top:45%"></div>
      <div class="obj obj-red" style="left:35%;top:55%"></div>
      <div class="obj obj-blue" style="left:60%;top:50%"></div>
      <div style="position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #eab308"></div>
      <div style="position:absolute;left:50%;top:70%;transform:translate(-50%,-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #eab308"></div>
    </div>
    <button class="preview-edit-btn" onclick="goToStep(1)">✎ Muokkaa piirtoa</button>
  </div>

  <!-- Right: info form -->
  <div class="info-panel">
    <div class="info-title">Harjoitteen tiedot</div>

    <div>
      <div class="panel-label">Kategoria</div>
      <select class="panel-input">
        <option>Taktinen</option>
        <option>Tekninen</option>
        <option>Fyysinen</option>
        <option>Lämmittely</option>
        <option>Peli</option>
      </select>
    </div>
    <div class="panel-row">
      <div>
        <div class="panel-label">Kesto (min)</div>
        <input class="panel-input" type="number" value="15">
      </div>
      <div>
        <div class="panel-label">Toistot</div>
        <input class="panel-input" type="number" value="3">
      </div>
    </div>
    <div>
      <div class="panel-label">Kuvaus</div>
      <textarea class="panel-input">Yksilöpuolustusharjoitus, painopiste asemoinnissa.</textarea>
    </div>
    <div>
      <div class="panel-label">Tavoitteet</div>
      <textarea class="panel-input" placeholder="Mitä harjoite kehittää?"></textarea>
    </div>
    <div>
      <div class="panel-label">Tagit</div>
      <div class="tag-cloud">
        <span class="tag active">1v1</span>
        <span class="tag active">Puolustaminen</span>
        <span class="tag">2v1</span>
        <span class="tag">Syöttäminen</span>
        <span class="tag">Nopeus</span>
        <span class="tag">Laukaus</span>
        <span class="tag">Yhteistyö</span>
      </div>
    </div>
    <div class="progress-hint">Vaihe 2 / 2 — täytä tiedot ja tallenna</div>
  </div>

</div>

<script>
function goToStep2() {
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').classList.add('visible');
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('saveBtn').classList.add('visible');
  document.getElementById('stepBtn1').className = 'step done';
  document.getElementById('stepBtn1').innerHTML = '<div class="step-num">✓</div>Piirtäminen';
  document.getElementById('stepBtn2').className = 'step active';
}

function goToStep(n) {
  if (n === 1) {
    document.getElementById('step1').style.display = 'flex';
    document.getElementById('step2').classList.remove('visible');
    document.getElementById('nextBtn').style.display = 'flex';
    document.getElementById('saveBtn').classList.remove('visible');
    document.getElementById('stepBtn1').className = 'step active';
    document.getElementById('stepBtn1').innerHTML = '<div class="step-num">1</div>Piirtäminen';
    document.getElementById('stepBtn2').className = 'step inactive';
  }
}
</script>
</body>
</html>
